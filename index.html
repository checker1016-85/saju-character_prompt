<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사주 캐릭터 엔진</title>
<meta name="gas-url" content="https://script.google.com/macros/s/AKfycbxiEATASurFLo0J57DDknNsT_phaNIDm82qRbLr_ufevlYmU_1SRptRzbjmydEFxfsNBw/exec">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');

:root {
  --bg: #0f0f13;
  --surface: #1a1a24;
  --surface2: #22222f;
  --border: #2d2d3d;
  --text: #e8e8f0;
  --text2: #9898b0;
  --accent: #6c5ce7;
  --accent2: #a29bfe;
  --gold: #f0c040;
  --red: #ff6b6b;
  --green: #51cf66;
  --blue: #74b9ff;
  --radius: 10px;
  --wood: #4CAF50;
  --fire: #F44336;
  --earth: #FF9800;
  --metal: #9E9E9E;
  --water: #2196F3;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* ─── Header ─── */
.header { background:linear-gradient(135deg,#1a1028,#0f0f13); border-bottom:1px solid var(--border); padding:16px 24px; display:flex; align-items:center; gap:12px; }
.header h1 { font-size:20px; font-weight:700; background:linear-gradient(135deg,var(--accent2),var(--gold)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.header .ver { font-size:11px; color:var(--text2); margin-left:auto; }

/* ─── Layout ─── */
.main { display:grid; grid-template-columns:320px 1fr 380px; gap:0; min-height:calc(100vh - 56px); }
@media (max-width:1100px) { .main { grid-template-columns:1fr; } }

.panel { border-right:1px solid var(--border); padding:16px; overflow-y:auto; max-height:calc(100vh - 56px); }
.panel:last-child { border-right:none; }
.panel-title { font-size:13px; font-weight:700; color:var(--accent2); margin-bottom:12px; letter-spacing:0.5px; text-transform:uppercase; }

/* ─── Forms ─── */
label { display:block; font-size:12px; color:var(--text2); margin-bottom:4px; font-weight:500; }
input, select { width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:6px; font-size:13px; font-family:inherit; outline:none; transition:border .2s; }
input:focus, select:focus { border-color:var(--accent); }
.row { display:flex; gap:8px; margin-bottom:10px; }
.row > * { flex:1; }
.field { margin-bottom:10px; }

/* ─── Buttons ─── */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 16px; border:none; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .2s; }
.btn-primary { background:var(--accent); color:#fff; width:100%; }
.btn-primary:hover { background:var(--accent2); }
.btn-secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
.btn-secondary:hover { border-color:var(--accent); }
.btn-gold { background:linear-gradient(135deg,#d4a020,#f0c040); color:#1a1a24; width:100%; }
.btn-gold:hover { filter:brightness(1.1); }
.btn-sm { padding:6px 10px; font-size:11px; }
.btn:disabled { opacity:0.4; cursor:not-allowed; }

/* ─── Saju Result Card ─── */
.saju-card { background:var(--surface2); border-radius:var(--radius); padding:14px; margin-bottom:12px; border:1px solid var(--border); }
.saju-card h3 { font-size:14px; margin-bottom:8px; color:var(--gold); }
.pillar-row { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px; }
.pillar { text-align:center; background:var(--surface); border-radius:8px; padding:8px 4px; border:1px solid var(--border); }
.pillar .label { font-size:10px; color:var(--text2); margin-bottom:4px; }
.pillar .gan { font-size:18px; font-weight:900; }
.pillar .ji { font-size:18px; font-weight:700; color:var(--accent2); }
.pillar .info { font-size:10px; color:var(--text2); margin-top:2px; }

/* ─── Ohaeng colors ─── */
.oh-wood { color:var(--wood) !important; }
.oh-fire { color:var(--fire) !important; }
.oh-earth { color:var(--earth) !important; }
.oh-metal { color:var(--metal) !important; }
.oh-water { color:var(--water) !important; }

/* ─── Tags ─── */
.tag { display:inline-block; padding:3px 8px; border-radius:12px; font-size:11px; margin:2px; border:1px solid var(--border); }
.tag-sipsung { background:#2d1b4e; color:var(--accent2); }
.tag-unseong { background:#1b3a2d; color:var(--green); }
.tag-ohaeng { border-color:transparent; }

/* ─── Job Grid ─── */
.job-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; max-height:300px; overflow-y:auto; margin-bottom:10px; }
.job-btn { padding:6px; font-size:11px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; cursor:pointer; text-align:center; transition:all .2s; color:var(--text); font-family:inherit; }
.job-btn:hover { border-color:var(--accent); }
.job-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

/* ─── Prompt Area ─── */
.prompt-box { background:#0a0a10; border:1px solid var(--border); border-radius:var(--radius); padding:12px; font-size:12px; line-height:1.7; color:var(--text); min-height:200px; max-height:400px; overflow-y:auto; white-space:pre-wrap; word-break:break-word; margin-bottom:10px; }

/* ─── Image Preview ─── */
.img-preview { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); min-height:300px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; overflow:hidden; position:relative; }
.img-preview img { max-width:100%; max-height:500px; object-fit:contain; }
.img-preview .placeholder { color:var(--text2); font-size:13px; }

/* ─── Loading ─── */
.spinner { width:24px; height:24px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.loading-overlay { position:absolute; inset:0; background:rgba(15,15,19,.85); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; z-index:10; }
.loading-overlay span { font-size:12px; color:var(--text2); }

/* ─── Misc ─── */
.divider { border:none; border-top:1px solid var(--border); margin:14px 0; }
.info-line { font-size:11px; color:var(--text2); line-height:1.5; margin-bottom:6px; }
.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:10px; font-size:11px; font-weight:600; }
.badge-learn { background:#2d1b4e; color:var(--accent2); }
.hidden { display:none !important; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; padding:10px 20px; border-radius:20px; font-size:13px; font-weight:500; z-index:999; animation:fadeInUp .3s; }
@keyframes fadeInUp { from { opacity:0; transform:translateX(-50%) translateY(10px); } }
</style>
</head>
<body>

<!-- ═══ Header ═══ -->
<div class="header">
  <h1>⚡ 사주 캐릭터 엔진</h1>
  <span class="ver">v1.0 — Prompt + Image</span>
</div>

<!-- ═══ Main 3-Column Layout ═══ -->
<div class="main">

  <!-- ═══ LEFT: 입력 + 사주 결과 ═══ -->
  <div class="panel" id="panelLeft">
    <div class="panel-title">📅 사주 입력</div>

    <div class="row">
      <div class="field">
        <label>생년</label>
        <input type="number" id="inYear" value="1985" min="1900" max="2030">
      </div>
      <div class="field">
        <label>월</label>
        <select id="inMonth">
          <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
          <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
          <option value="7">7월</option><option value="8">8월</option><option value="9">9월</option>
          <option value="10" selected>10월</option><option value="11">11월</option><option value="12">12월</option>
        </select>
      </div>
      <div class="field">
        <label>일</label>
        <input type="number" id="inDay" value="16" min="1" max="31">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>시 (0~23)</label>
        <input type="number" id="inHour" value="8" min="0" max="23">
      </div>
      <div class="field">
        <label>성별</label>
        <select id="inGender">
          <option value="male">남</option>
          <option value="female">여</option>
        </select>
      </div>
    </div>

    <button class="btn btn-primary" id="btnSaju" onclick="fetchSaju()">🔮 만세력 조회</button>

    <!-- 사주 결과 -->
    <div id="sajuResult" class="hidden" style="margin-top:14px;">
      <div class="saju-card">
        <h3>사주 원국</h3>
        <div class="pillar-row" id="pillarRow"></div>
        <div id="sajuMeta"></div>
      </div>

      <hr class="divider">
      <div class="panel-title">💼 직업 선택 (선택사항)</div>
      <div class="info-line">직업을 선택하면 의상·소품이 프롬프트에 추가됩니다.</div>
      <div class="job-grid" id="jobGrid"></div>
      <button class="btn btn-sm btn-secondary" onclick="clearJob()">직업 해제</button>
    </div>
  </div>

  <!-- ═══ CENTER: 프롬프트 옵션 ═══ -->
  <div class="panel" id="panelCenter">
    <div class="panel-title">🎨 프롬프트 옵션</div>

    <div class="row">
      <div class="field">
        <label>나이대</label>
        <select id="optAge">
          <option value="auto">자동 (생년 기반)</option>
          <option value="10대">10대</option>
          <option value="20대">20대</option>
          <option value="30대">30대</option>
          <option value="40대">40대</option>
          <option value="50대">50대</option>
          <option value="60대+">60대+</option>
        </select>
      </div>
      <div class="field">
        <label>아트 스타일</label>
        <select id="optStyle">
          <option value="anime">일본 소년만화</option>
          <option value="semirealistic">세미 리얼리스틱</option>
          <option value="realistic">포토 리얼리스틱</option>
          <option value="chibi">SD/치비</option>
          <option value="watercolor">수채화</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>배경</label>
        <select id="optBg">
          <option value="white">순백 (#FFFFFF)</option>
          <option value="gradient">그라데이션</option>
          <option value="scene">상황맞춤</option>
        </select>
      </div>
      <div class="field">
        <label>포즈</label>
        <select id="optPose">
          <option value="standing">전신 정자세</option>
          <option value="half">반신</option>
          <option value="action">액션 포즈</option>
          <option value="sitting">앉은 자세</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>프롬프트 타입</label>
      <select id="optType">
        <option value="webai">웹AI용 (한국어 설명형)</option>
        <option value="sd">SD/ComfyUI용 (영문 태그)</option>
      </select>
    </div>

    <div class="field">
      <label>추가 요청 (자유 입력)</label>
      <textarea id="optExtra" rows="3" style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;font-size:12px;font-family:inherit;resize:vertical;" placeholder="예: 안경을 쓰고 있음, 커피를 들고 있음..."></textarea>
    </div>

    <div class="row" style="margin-top:6px;">
      <button class="btn btn-gold" id="btnGenPrompt" onclick="generatePrompt()" disabled>⚡ 프롬프트 생성</button>
      <button class="btn btn-secondary" onclick="resetOptions()" style="flex:0 0 80px;">초기화</button>
    </div>

    <hr class="divider">

    <div class="panel-title">📋 최종 프롬프트</div>
    <div class="prompt-box" id="promptBox">사주 조회 후 프롬프트를 생성하세요.</div>
    <div class="row">
      <button class="btn btn-sm btn-secondary" onclick="copyPrompt('webai')">📋 복사 (웹AI)</button>
      <button class="btn btn-sm btn-secondary" onclick="copyPrompt('sd')">📋 복사 (SD)</button>
    </div>
  </div>

  <!-- ═══ RIGHT: 이미지 생성 ═══ -->
  <div class="panel" id="panelRight">
    <div class="panel-title">🖼️ 이미지 생성</div>

    <div class="img-preview" id="imgPreview">
      <span class="placeholder">프롬프트 생성 후 이미지를 만들 수 있습니다</span>
    </div>

    <button class="btn btn-primary" id="btnGenImage" onclick="generateImage()" disabled>🎨 Gemini 이미지 생성</button>

    <div class="row" style="margin-top:8px;">
      <button class="btn btn-sm btn-secondary" id="btnDownload" onclick="downloadImage()" disabled>⬇ 다운로드</button>
      <button class="btn btn-sm btn-secondary" id="btnSave" onclick="saveSuccess()" disabled>⭐ 학습 저장</button>
    </div>

    <hr class="divider">

    <div id="sajuInfo" class="hidden">
      <div class="panel-title">📖 일주 해석</div>
      <div id="iljuDesc" style="font-size:12px;line-height:1.7;color:var(--text2);max-height:400px;overflow-y:auto;"></div>
    </div>
  </div>

</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<script>
// ═══════════════════════════════════════════════════════
// 전역 변수
// ═══════════════════════════════════════════════════════
const GAS_URL = document.querySelector('meta[name="gas-url"]').content;

let S = {
  saju: null,        // SAZU API 응답
  ilju: null,        // 일주 DB 데이터
  wolju: null,       // 월주 DB 데이터
  selectedJob: null, // 선택된 직업
  prompt: { webai: '', sd: '' },
  imageBase64: null,
  imageMime: null,
  db: {}             // JSON DB 캐시
};

// ═══════════════════════════════════════════════════════
// DB 로딩 (JSON 파일)
// ═══════════════════════════════════════════════════════
const DB_BASE = './Saju-Myungli-JSON/';
const DB_FILES = [
  '10_오행천간지지기초',
  '11_합충관계',
  '12_십성운성신살',
  '13_원국분석',
  '20_일주론'
];

async function loadDB() {
  for (const f of DB_FILES) {
    try {
      const res = await fetch(DB_BASE + f + '.json');
      if (res.ok) S.db[f] = await res.json();
    } catch(e) { console.warn('DB load fail:', f, e); }
  }
  console.log('DB loaded:', Object.keys(S.db));
}

// ═══════════════════════════════════════════════════════
// 오행 매핑
// ═══════════════════════════════════════════════════════
const OH_MAP = {
  '갑':'목','을':'목','병':'화','정':'화','무':'토',
  '기':'토','경':'금','신':'금','임':'수','계':'수',
  '甲':'목','乙':'목','丙':'화','丁':'화','戊':'토',
  '己':'토','庚':'금','辛':'금','壬':'수','癸':'수'
};
const OH_COLOR = { '목':'oh-wood','화':'oh-fire','토':'oh-earth','금':'oh-metal','수':'oh-water' };
const YY_MAP = {
  '갑':'양','을':'음','병':'양','정':'음','무':'양',
  '기':'음','경':'양','신':'음','임':'양','계':'음'
};

function ohClass(char) { return OH_COLOR[OH_MAP[char]] || ''; }

// ═══════════════════════════════════════════════════════
// 직업 목록
// ═══════════════════════════════════════════════════════
const JOBS = [
  '교사','교수','연구원','의사','간호사','약사',
  '변호사','판사','검사','경찰','군인','소방관',
  '프로그래머','디자이너','건축가','회계사','은행원','공무원',
  '요리사','바리스타','제빵사','기자','작가','번역가',
  '배우','가수','댄서','사진작가','영화감독','화가',
  'CEO','마케터','컨설턴트','트레이더','부동산','사업가',
  '운동선수','코치','수의사','농부','어부','목수',
  '스타일리스트','모델','뷰티','정비사','파일럿','승무원'
];

function renderJobs() {
  const g = document.getElementById('jobGrid');
  g.innerHTML = JOBS.map(j =>
    `<button class="job-btn" onclick="selectJob(this,'${j}')">${j}</button>`
  ).join('');
}

function selectJob(el, job) {
  document.querySelectorAll('.job-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  S.selectedJob = job;
}

function clearJob() {
  document.querySelectorAll('.job-btn').forEach(b => b.classList.remove('active'));
  S.selectedJob = null;
}

// ═══════════════════════════════════════════════════════
// GAS 통신
// ═══════════════════════════════════════════════════════
async function gasCall(action, data) {
  const body = Object.assign({ action }, data);
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  return res.json();
}

// ═══════════════════════════════════════════════════════
// 만세력 조회
// ═══════════════════════════════════════════════════════
async function fetchSaju() {
  const btn = document.getElementById('btnSaju');
  btn.disabled = true;
  btn.textContent = '⏳ 조회 중...';

  try {
    const year = parseInt(document.getElementById('inYear').value);
    const month = parseInt(document.getElementById('inMonth').value);
    const day = parseInt(document.getElementById('inDay').value);
    const hour = parseInt(document.getElementById('inHour').value);
    const gender = document.getElementById('inGender').value;
    const isFemale = gender === 'female';

    const result = await gasCall('getSaju', {
      birthYear: year, birthMonth: month, birthDay: day,
      birthHour: hour, isFemale: isFemale
    });

    if (!result.ok) throw new Error(result.error || 'API 오류');

    S.saju = result.saju;
    renderSajuResult();
    matchIljuDB();

    document.getElementById('sajuResult').classList.remove('hidden');
    document.getElementById('sajuInfo').classList.remove('hidden');
    document.getElementById('btnGenPrompt').disabled = false;

    showToast('✅ 사주 조회 완료');

  } catch(e) {
    console.error(e);
    showToast('❌ ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '🔮 만세력 조회';
  }
}

// ═══════════════════════════════════════════════════════
// 사주 결과 렌더링
// ═══════════════════════════════════════════════════════
function renderSajuResult() {
  const saju = S.saju;
  if (!saju) return;

  // SAZU API 응답 구조에 맞게 파싱
  // 4주 데이터 추출 (API 응답 구조에 따라 조정 필요)
  const pillars = extractPillars(saju);

  const row = document.getElementById('pillarRow');
  const labels = ['년주','월주','일주','시주'];
  row.innerHTML = pillars.map((p, i) => `
    <div class="pillar">
      <div class="label">${labels[i]}</div>
      <div class="gan ${ohClass(p.gan)}">${p.gan}</div>
      <div class="ji ${ohClass(p.ji)}">${p.ji}</div>
      <div class="info">${OH_MAP[p.gan]||''}${YY_MAP[p.gan]||''} / ${p.ji}</div>
    </div>
  `).join('');

  // 메타 정보
  const ilju = pillars[2];
  const meta = document.getElementById('sajuMeta');
  meta.innerHTML = `
    <div class="info-line">
      <strong>일주:</strong> ${ilju.gan}${ilju.ji} (${OH_MAP[ilju.gan]}${YY_MAP[ilju.gan]})
      &nbsp;|&nbsp;
      <strong>월주:</strong> ${pillars[1].gan}${pillars[1].ji}
    </div>
  `;
}

/**
 * SAZU API 응답에서 4주 추출
 * API 응답 구조가 다를 수 있으므로 여러 형태 지원
 */
function extractPillars(saju) {
  // 형태 1: { year: {gan, ji}, month: {gan, ji}, day: {gan, ji}, hour: {gan, ji} }
  if (saju.year && saju.year.gan) {
    return [saju.year, saju.month, saju.day, saju.hour];
  }
  // 형태 2: { saju: { year: ... } }
  if (saju.saju) return extractPillars(saju.saju);
  // 형태 3: { fourPillars: { year: ... } }
  if (saju.fourPillars) return extractPillars(saju.fourPillars);
  // 형태 4: { result: { ... } }
  if (saju.result) return extractPillars(saju.result);
  // fallback
  return [
    {gan:'?',ji:'?'},{gan:'?',ji:'?'},
    {gan:'?',ji:'?'},{gan:'?',ji:'?'}
  ];
}

// ═══════════════════════════════════════════════════════
// 일주 DB 매칭
// ═══════════════════════════════════════════════════════
function matchIljuDB() {
  const pillars = extractPillars(S.saju);
  const iljuStr = pillars[2].gan + pillars[2].ji;
  const woljuStr = pillars[1].gan + pillars[1].ji;

  // 20_일주론 JSON (멀티시트 구조) 에서 매칭
  const db20 = S.db['20_일주론'] || {};
  const iljuList = db20['일주기초'] || [];
  const dnaList = db20['일주캐릭터DNA'] || [];
  const woljuList = db20['월주기초'] || [];

  S.ilju = iljuList.find(r => {
    const name = (r['일주'] || '').replace(/\(.*\)/, '').trim();
    return name === iljuStr || name.includes(iljuStr);
  });

  // DNA 매칭
  S.iljuDNA = dnaList.find(r => {
    const name = (r['일주'] || '').replace(/\(.*\)/, '').trim();
    return name === iljuStr || name.includes(iljuStr);
  });

  // 월주 매칭
  S.wolju = woljuList.find(r => {
    const name = (r['월주'] || '').replace(/\(.*\)/, '').trim();
    return name === woljuStr || name.includes(woljuStr);
  });

  // 일주 해석 표시
  const descEl = document.getElementById('iljuDesc');
  if (S.ilju) {
    let html = `
      <p><strong>${S.ilju['일주']}</strong></p>
      <p><span class="tag tag-sipsung">${S.ilju['일지 십성'] || ''}</span>
         <span class="tag tag-unseong">${S.ilju['12운성(일간↔일지)'] || ''}</span>
         <span class="tag">${S.ilju['납음'] || ''}</span></p>
      <hr class="divider">
      <p style="white-space:pre-wrap;">${(S.ilju['일주 고유 성격'] || '').substring(0, 800)}...</p>
      <hr class="divider">
      <p><strong>외형:</strong></p>
      <p style="white-space:pre-wrap;">${(S.ilju['일주 고유 외형'] || '').substring(0, 600)}...</p>
    `;
    if (S.wolju) {
      html += `<hr class="divider"><p><strong>월주 (${S.wolju['월주'] || woljuStr}):</strong></p>`;
      const woljuDesc = S.wolju['사회적 페르소나'] || S.wolju['직업분야'] || '';
      if (woljuDesc) html += `<p style="font-size:11px;white-space:pre-wrap;">${woljuDesc.substring(0, 400)}</p>`;
    }
    descEl.innerHTML = html;
  } else {
    descEl.innerHTML = '<p>일주 DB에서 "' + iljuStr + '"을 찾을 수 없습니다. DB 보강이 필요합니다.</p>';
  }
}

// ═══════════════════════════════════════════════════════
// 프롬프트 생성
// ═══════════════════════════════════════════════════════
function generatePrompt() {
  if (!S.saju) { showToast('먼저 만세력을 조회하세요'); return; }

  const pillars = extractPillars(S.saju);
  const ilju = pillars[2];
  const wolju = pillars[1];
  const gender = document.getElementById('inGender').value === 'female' ? '여성' : '남성';
  const genderEn = document.getElementById('inGender').value === 'female' ? 'woman' : 'man';

  // 나이 계산
  let age = document.getElementById('optAge').value;
  if (age === 'auto') {
    const birthYear = parseInt(document.getElementById('inYear').value);
    const currentAge = new Date().getFullYear() - birthYear;
    age = Math.floor(currentAge / 10) * 10 + '대';
    if (currentAge < 20) age = '10대';
    if (currentAge >= 60) age = '60대+';
  }

  const style = document.getElementById('optStyle').value;
  const bg = document.getElementById('optBg').value;
  const pose = document.getElementById('optPose').value;
  const extra = document.getElementById('optExtra').value.trim();

  // 일주 DB 데이터
  const iljuData = S.ilju || {};
  const ohaeng = OH_MAP[ilju.gan] || '';
  const yinyang = YY_MAP[ilju.gan] || '';
  const sipsung = iljuData['일지 십성'] || '';
  const unseong = iljuData['12운성(일간↔일지)'] || '';
  const napeum = iljuData['납음'] || '';
  const appearance = iljuData['일주 고유 외형'] || '';
  const personality = iljuData['일주 고유 성격'] || '';
  const keywords = iljuData['핵심 키워드'] || '';

  // ── 웹AI용 프롬프트 ──
  const styleMap = {
    anime: '일본 소년만화 스타일 (나루토/주술회전 화풍)',
    semirealistic: '세미 리얼리스틱 일러스트',
    realistic: '포토 리얼리스틱',
    chibi: 'SD/치비 스타일 (6등신)',
    watercolor: '수채화 일러스트'
  };
  const bgMap = {
    white: '배경: 순수 흰색 (#FFFFFF)',
    gradient: '배경: 오행 색상 그라데이션',
    scene: '배경: 캐릭터 분위기에 맞는 상황'
  };
  const poseMap = {
    standing: '전신 정자세 (정면)',
    half: '반신 (상체 클로즈업)',
    action: '액션 포즈 (동적)',
    sitting: '앉은 자세 (자연스러운)'
  };

  let webai = `[사주 캐릭터 프롬프트]\n\n`;
  webai += `■ 기본 정보\n`;
  webai += `일주: ${ilju.gan}${ilju.ji} | 오행: ${ohaeng}(${yinyang}) | 일지십성: ${sipsung} | 12운성: ${unseong} | 납음: ${napeum}\n`;
  webai += `월주: ${wolju.gan}${wolju.ji} | 성별: ${gender} | 나이대: ${age}\n`;
  if (S.selectedJob) webai += `직업: ${S.selectedJob}\n`;
  webai += `\n`;

  webai += `■ 성격·기질\n`;
  // 성격에서 핵심만 추출 (너무 길면 줄임)
  const personalityShort = personality.split('\n').filter(l => l.trim()).slice(0, 6).join('\n');
  webai += personalityShort + '\n\n';

  webai += `■ 외형 상세\n`;
  webai += appearance + '\n\n';

  if (S.selectedJob) {
    webai += `■ 직업 비주얼\n`;
    webai += `${S.selectedJob}에 어울리는 의상과 소품을 착용. 기본 체형·얼굴 특성은 유지하되 직업 유니폼/도구를 추가.\n\n`;
  }

  webai += `■ 연출\n`;
  webai += `스타일: ${styleMap[style]}\n`;
  webai += `${bgMap[bg]}\n`;
  webai += `포즈: ${poseMap[pose]}\n`;
  webai += `좌상단에 "${ilju.gan}${ilju.ji}" 텍스트 표기\n`;
  webai += `한 명만 그릴 것. 판타지 요소·무기 금지.\n`;

  if (extra) webai += `\n■ 추가 요청\n${extra}\n`;

  // ── SD용 프롬프트 ──
  const styleSD = {
    anime: 'anime style, shonen manga style, detailed lineart',
    semirealistic: 'semi-realistic, detailed illustration, digital art',
    realistic: 'photorealistic, 8k, ultra detailed, studio lighting',
    chibi: 'chibi style, super deformed, cute, 3 head tall',
    watercolor: 'watercolor painting, soft edges, artistic, painted texture'
  };
  const bgSD = {
    white: 'pure white background, simple background',
    gradient: 'gradient background, atmospheric',
    scene: 'detailed background, environmental'
  };
  const poseSD = {
    standing: 'full body, standing, front view',
    half: 'upper body, portrait, close up',
    action: 'dynamic pose, action shot, full body',
    sitting: 'sitting, relaxed pose'
  };

  // 외형에서 영문 키워드 추출 시도
  let appearanceEN = `Korean ${genderEn} in ${age.replace('대','s')}`;

  // 오행별 기본 외형 키워드
  const ohAppearance = {
    '목': 'tall slender frame, long limbs, elegant posture, clear bright eyes',
    '화': 'athletic build, sharp features, bright eyes, warm complexion',
    '토': 'sturdy balanced frame, round face, warm eyes, earthy skin tone',
    '금': 'refined bone structure, sharp jawline, pale skin, piercing eyes',
    '수': 'soft rounded features, deep eyes, dark hair, cool skin tone'
  };

  let sd = `masterpiece, best quality, ultra detailed, ${styleSD[style]},\n`;
  sd += `${appearanceEN}, solo, 1person,\n`;
  sd += `${ohAppearance[ohaeng] || ''},\n`;
  sd += `${poseSD[pose]}, ${bgSD[bg]},\n`;

  if (S.selectedJob) {
    sd += `${S.selectedJob} outfit, professional attire,\n`;
  }

  if (extra) sd += `${extra},\n`;

  sd += `high quality, detailed face, detailed hands`;

  S.prompt = { webai, sd };

  // 표시
  const type = document.getElementById('optType').value;
  document.getElementById('promptBox').textContent = S.prompt[type];
  document.getElementById('btnGenImage').disabled = false;

  showToast('✅ 프롬프트 생성 완료');
}

// ═══════════════════════════════════════════════════════
// 프롬프트 복사
// ═══════════════════════════════════════════════════════
function copyPrompt(type) {
  const text = S.prompt[type];
  if (!text) { showToast('프롬프트가 없습니다'); return; }
  navigator.clipboard.writeText(text).then(() => showToast('📋 복사됨'));
  document.getElementById('promptBox').textContent = text;
}

// ═══════════════════════════════════════════════════════
// 이미지 생성 (Gemini via GAS)
// ═══════════════════════════════════════════════════════
async function generateImage() {
  const btn = document.getElementById('btnGenImage');
  const preview = document.getElementById('imgPreview');

  btn.disabled = true;
  preview.innerHTML = '<div class="loading-overlay"><div class="spinner"></div><span>Gemini 이미지 생성 중...</span></div>';

  try {
    // SD 프롬프트를 이미지 생성에 사용
    const prompt = S.prompt.sd || S.prompt.webai;
    if (!prompt) throw new Error('프롬프트가 없습니다');

    const result = await gasCall('generateImage', { prompt });

    if (!result.ok) throw new Error(result.error || '이미지 생성 실패');

    S.imageBase64 = result.image;
    S.imageMime = result.mimeType || 'image/png';

    preview.innerHTML = `<img src="data:${S.imageMime};base64,${S.imageBase64}" alt="Generated character">`;
    document.getElementById('btnDownload').disabled = false;
    document.getElementById('btnSave').disabled = false;

    showToast('✅ 이미지 생성 완료');

  } catch(e) {
    console.error(e);
    preview.innerHTML = `<span class="placeholder" style="color:var(--red);">❌ ${e.message}</span>`;
    showToast('❌ ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

// ═══════════════════════════════════════════════════════
// 다운로드
// ═══════════════════════════════════════════════════════
function downloadImage() {
  if (!S.imageBase64) return;
  const pillars = extractPillars(S.saju);
  const ilju = pillars[2];
  const gender = document.getElementById('inGender').value === 'female' ? '녀' : '남';
  const fileName = `${ilju.gan}${ilju.ji}_${gender}_${Date.now()}.png`;

  const a = document.createElement('a');
  a.href = `data:${S.imageMime};base64,${S.imageBase64}`;
  a.download = fileName;
  a.click();
}

// ═══════════════════════════════════════════════════════
// 학습 저장
// ═══════════════════════════════════════════════════════
async function saveSuccess() {
  if (!S.imageBase64 || !S.saju) return;
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = '⏳ 저장 중...';

  try {
    const pillars = extractPillars(S.saju);
    const ilju = pillars[2].gan + pillars[2].ji;
    const gender = document.getElementById('inGender').value === 'female' ? '녀' : '남';

    const result = await gasCall('saveSuccess', {
      ilju: ilju,
      gender: gender,
      imageBase64: S.imageBase64,
      mimeType: S.imageMime,
      prompt: S.prompt.sd || S.prompt.webai,
      options: {
        job: S.selectedJob,
        style: document.getElementById('optStyle').value,
        age: document.getElementById('optAge').value
      }
    });

    if (!result.ok) throw new Error(result.error);
    showToast('⭐ 학습 저장 완료: ' + result.saved.fileName);

  } catch(e) {
    showToast('❌ ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '⭐ 학습 저장';
  }
}

// ═══════════════════════════════════════════════════════
// 유틸
// ═══════════════════════════════════════════════════════
function resetOptions() {
  document.getElementById('optAge').value = 'auto';
  document.getElementById('optStyle').value = 'anime';
  document.getElementById('optBg').value = 'white';
  document.getElementById('optPose').value = 'standing';
  document.getElementById('optType').value = 'webai';
  document.getElementById('optExtra').value = '';
  clearJob();
  S.prompt = { webai: '', sd: '' };
  S.imageBase64 = null;
  document.getElementById('promptBox').textContent = '사주 조회 후 프롬프트를 생성하세요.';
  document.getElementById('imgPreview').innerHTML = '<span class="placeholder">프롬프트 생성 후 이미지를 만들 수 있습니다</span>';
  document.getElementById('btnGenImage').disabled = true;
  document.getElementById('btnDownload').disabled = true;
  document.getElementById('btnSave').disabled = true;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.add('hidden'), 2500);
}

// 프롬프트 타입 변경 시 표시 업데이트
document.getElementById('optType').addEventListener('change', function() {
  const type = this.value;
  if (S.prompt[type]) {
    document.getElementById('promptBox').textContent = S.prompt[type];
  }
});

// ═══════════════════════════════════════════════════════
// 초기화
// ═══════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  renderJobs();
  await loadDB();
  console.log('Saju Character Engine ready');
});
</script>
